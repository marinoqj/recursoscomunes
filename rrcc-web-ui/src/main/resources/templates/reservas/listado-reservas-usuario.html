<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/head :: head('Listado de reservas')">


</head>

<body>

	<header>
		<nav th:replace="fragments/navbar :: navbar"></nav>
	</header>

	<main>
		<div class="container" style="min-height: 90vh">

<br>
<br>
<br>


<form name="formulario" method="post">
<!-- 	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
	<input type="hidden" name="idReserva"/>	
	<input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}"/>
</form>

<br>
<br>

<div class="row">
	<div class="col-md-12">
				<h4 class="texto-azul"><i class="fas fa-users"></i>&nbsp;&nbsp;Listado de reservas del usuario <span th:text="${usuario.identificador}"></span></span></h4>
	</div>
</div>
<hr class="texto-azul">

<div class="row" th:if="${mensaje != null}">
	<div class="col-md-12 text-center">			
		<div class="alert alert-warning alert-dismissible fade show" role="alert">
			<span th:text="${mensaje}"></span></b>
		</div>
	</div>
</div>
<br>



<div th:classappend="${reservas!=null and !reservas.isEmpty() ? 'block' : 'd-none'}">


<div class="row">
	<div class="col-md-8">&nbsp;</div>
	<div class="col-md-4">
  		<ul th:replace="${paginacion} ? ~{fragments/paginacion :: paginacion('listadoUsuariosFiltrado')} : ~{}" ></ul>
	</div>
</div>
<div class="row">
		<table class="table table-hover table-striped table-sm">
			<caption>Listado de reservas</caption>
			<thead class="table-light">
				<tr>
					<th scope="col">Fecha</th>		
					<th scope="col">Recurso</th>						
					<th scope="col">Hora inicio</th>
					<th scope="col">Hora fin</th>
					<th width="10%">&nbsp;</th>
			</thead>
			<tbody>
				<tr th:each="reserva : ${reservas}">						
						<td th:text="${#dates.format(reserva.fecha, 'dd/MM/yyyy')}" />
						<td th:text="${reserva.recurso.tipoRecurso.descripcion}" />
						<td th:text="${#dates.format(reserva.horaInicio, 'HH:mm')}" />
						<td th:text="${#dates.format(reserva.horaFin, 'HH:mm')}" />
				        <td>
				        	<a href="#" th:onclick="javascript:mostrarConfirm([[${reserva.idReserva}]])"><i class="fa fa-trash fa-lg text-danger" data-toggle="tooltip" title="Anular reserva"></i></a>
				        </td> 																							
				</tr>				
			</tbody>
		</table>
</div>

</div>



<div th:classappend="${reservas == null or reservas.isEmpty()  ? 'block' : 'd-none'}">

	<br><br><br><br><br><br>

		<div class="row">
			<div class="col-md-12 text-center">
				<div class="form-row">
					<div class="form-group col-md-12">
						<div class="alert alert-warning alert-dismissible fade show"
							role="alert">
							<span>No hay reservas que mostrar</span>
							<button type="button" class="close" data-dismiss="alert"
								aria-label="Close">
								<span aria-hidden="true">&times;</span>
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>
</div>

<div class="row">
	<div class="col-md-10">&nbsp;</div>
	<div class="col-md-2 text-end">
			<a th:href="@{'/verNuevaReserva' + ${usuario.idUsuario}}" class="btn btn-primary btn-sm">Nueva reserva</a>
	</div>
</div>

<!-- Mensaje Baja Modal -->
<div id="confirmModal" class="modal" tabindex="-1" role="dialog">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header alert text-white text-left" style="background-color: red;">
      	<h5 class="modal-title"><i class="fas fa-exclamation-circle fa-lg"></i>&nbsp;Atención</h5>  
		<i class="fas fa-times align-bottom" style="cursor:pointer;" data-dismiss="modal"></i>	     
      </div>    
      <div class="modal-body">
         <p class="text-center">Va a anular la reserva. ¿Desea continuar?</p>
      </div>
      <div class="modal-footer">         
         <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal"><i class="fas fa-times-circle"></i>&nbsp;&nbsp;Cancelar</button>
         <a href="#" role="button" id="botonAceptar" class="btn btn-danger btn-sm"><i class="fas fa-check-circle"></i>&nbsp;&nbsp;Aceptar</a>
      </div>
    </div>
  </div>
</div>
<!-- ./ Confirm Modal -->

</div>
<!-- Fin container -->
<br>
</main>


<br>
<br>
<br>
<br>


<script type="text/javascript">


function anularReserva(idReserva){
	
	document.formulario.idReserva.value = idReserva;	
	document.formulario.action="anularReserva";
	document.formulario.submit();
}

function mostrarConfirm(idReserva) {
	var message = "";
	$("#botonAceptar").click(function() {
		anularReserva(idReserva);
	});
    $('#confirmModal').modal('show');
}

</script>

<footer th:replace="fragments/footer :: footer"></footer>


</body>
</html>
