<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments/head :: head('Listado de usuarios')">


</head>

<body>

	<header>
		<nav th:replace="fragments/navbar :: navbar"></nav>
	</header>

	<main>
		<div class="container" style="min-height: 90vh">

<br>
<br>
<br>
<br>



<div class="row">
	<div class="col-md-12 text-end">			
		<a th:href="@{/listadoUsuarios}" class="texto-azul" style="text-decoration: none; cursor:pointer;"><i class="fas fa-arrow-circle-left"></i> &nbsp;&nbsp;Volver</a>
	</div>
</div>
<div class="row">
	<div class="col-md-12">
		<h4 class="texto-azul"><i class="fa fa-user"></i>
			<span th:if="${modo == 'insertar'}">&nbsp;&nbsp;Nueva reserva</span>
			<span th:if="${modo == 'actualizar'}">&nbsp;&nbsp;Editar reserva</span>
		 </h4>						
	</div>
</div>
<hr class="texto-azul">

<div class="row" th:if="${mensaje != null}">
	<div class="col-md-12 text-center">			
		<div class="alert alert-warning alert-dismissible fade show" role="alert">
			<span th:text="${mensaje}"></span>
		</div>
	</div>
</div>
<br>

  	<!-- Datos personales -->
	<form th:action="${modo + 'Reserva'}" th:object="${reservaForm}" method="post">
		<input type="hidden" th:field="*{idUsuario}"/>
		<div class="row">
			<div class="col-md-12">
				<!-- Grid row -->
				<div class="row">
					<!-- Default input -->
					<div class="form-group col-md-12">
                        <label for="recurso">Recurso</label><span class="form-text text-danger"> *</span>
                        <select class="form-select" th:field="*{idRecurso}">
                            <option value="">Seleccione el recurso a reservar</option>
                            <option th:each="recurso : ${recursos}" th:text="${recurso.tipoRecurso.descripcion}" th:value="${recurso.idRecurso}"></option>
                        </select>
                        <span class="form-text text-danger" th:errors="*{idRecurso}" th:if="${#fields.hasErrors('idRecurso')}"></span>
					</div>
				</div>
				<br>
				<!-- Grid row -->
				<div class="row">
					<!-- Default input -->
					<div class="form-group col-md-12">
						<label for="fecha">Fecha</label><span class="form-text text-danger"> *</span>
						<input type="date" class="form-control" th:field="*{fecha}">
						<span class="form-text text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></span>	
					</div>
				</div>
				<br>				
				<!-- Grid row -->
				<div class="row">
					<!-- Default input -->
					<div class="form-group col-md-12">
						<label for="horaInicio">Hora inicio</label><span class="form-text text-danger"> *</span>
						<input type="text" class="form-control" th:field="*{horaInicio}">
						<span class="form-text text-danger" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></span>	
					</div>
				</div>
				<br>
				<!-- Grid row -->
				<div class="row">
					<!-- Default input -->
					<div class="form-group col-md-12">
						<label for="horaFin">Hora fin</label><span class="form-text text-danger"> *</span>
						<input type="text" class="form-control" th:field="*{horaFin}">
						<span class="form-text text-danger" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></span>	
					</div>
				</div>
				<br>											
				<div class="row">
					<div class="form-group col-md-12 align-self-end text-end">
							<a th:href="@{/listadoUsuarios}"  class="btn btn-secondary btn-sm px-4">Cancelar</a>
							&nbsp;&nbsp;
							<button class="btn btn-primary btn-sm" type="submit">Guardar</button>
					</div>		
				</div>	
				<!-- Extended default form grid -->
			</div>
		</div>
	</form>




</div>
<!-- Fin container -->
<br>
</main>


<br>
<br>
<br>
<br>


<footer th:replace="fragments/footer :: footer"></footer>


</body>
</html>
